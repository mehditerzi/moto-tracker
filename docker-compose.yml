services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mototracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: /data/app.db
      WEB_ORIGIN: ${WEB_ORIGIN}
      APP_BASE_URL: ${APP_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MotoTracker <noreply@example.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4}
      OCR_AUTO_APPLY_THRESHOLD: ${OCR_AUTO_APPLY_THRESHOLD:-0.7}
      UPLOADS_DIR: /data/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@mototracker.app}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Europe/Istanbul}
      CRON_HOUR: ${CRON_HOUR:-9}
      CRON_ENABLED: ${CRON_ENABLED:-true}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"

  ollama:
    image: ollama/ollama:latest
    container_name: mototracker-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama:/root/.ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mototracker-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      - api
