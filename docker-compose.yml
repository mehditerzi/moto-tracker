services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mototracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: /data/app.db
      UPLOADS_DIR: /data/uploads
      WEB_ROOT: /app/public
      TRUST_PROXY: "true"
      # Public origin where the app is reachable through ngrok.
      APP_BASE_URL: ${APP_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # iOS (Capacitor) wrapper support — leave both unset for the web deploy.
      # When shipping the native app, set in .env:
      #   WEB_ORIGIN=capacitor://localhost   (adds it to CORS + auth trusted origins)
      #   CROSS_SITE_COOKIES=true             (session cookie SameSite=None; Secure)
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      CROSS_SITE_COOKIES: ${CROSS_SITE_COOKIES:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Garajım <noreply@example.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # By default the api talks to an Ollama already running on the host
      # (Docker Desktop / Linux with host-gateway). To run a bundled Ollama
      # container instead, set OLLAMA_URL=http://ollama:11434 in .env and
      # `docker compose --profile bundled-ollama up -d`.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:26b}
      OCR_AUTO_APPLY_THRESHOLD: ${OCR_AUTO_APPLY_THRESHOLD:-0.7}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@mototracker.app}
      # Native push (APNs) for the iOS app — off until all four below are set.
      # Web Push (VAPID) does not fire inside the iOS WebView; see
      # docs/app-store/native-push.md.
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-true}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Europe/Istanbul}
      CRON_HOUR: ${CRON_HOUR:-9}
      CRON_ENABLED: ${CRON_ENABLED:-true}
    volumes:
      - ./data:/data
    # Bind to loopback only — public access goes through the tunnel
    # (Cloudflare in production; ngrok is legacy/opt-in).
    ports:
      - "127.0.0.1:8787:8787"
    # Allow the container to reach an Ollama running on the host
    # (Docker Desktop has this built-in; Linux needs host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: mototracker-ollama
    restart: unless-stopped
    # Opt-in: not started unless `docker compose --profile bundled-ollama up`.
    profiles: ["bundled-ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama:/root/.ollama

  # Cloudflare Tunnel (production). Opt-in service: started only with
  # `docker compose --profile cloudflare up -d`. The public hostname + ingress
  # (→ http://api:8787) are configured in the Cloudflare Zero Trust dashboard;
  # this just runs the connector using the tunnel token. If you already run
  # cloudflared elsewhere (host service / separate container), leave this off.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mototracker-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
    depends_on:
      - api

  # ngrok (legacy). Opt-in: `docker compose --profile ngrok up -d`.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: mototracker-ngrok
    restart: unless-stopped
    profiles: ["ngrok"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # Tunnel definition comes from ./ngrok.yml — bootstrap.sh writes this file
    # with `domain:` set when NGROK_DOMAIN is configured, omitted otherwise.
    command: ["start", "--all", "--log=stdout", "--config", "/etc/ngrok.yml"]
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      # ngrok local web inspector — useful for debugging.
      - "127.0.0.1:4040:4040"
    depends_on:
      - api
