<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4.
         iOS auto-zoom on input focus is prevented the correct way instead — every
         form control is ≥16px on phones (see components/ui/input.tsx). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0E" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Garajım" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Garajım</title>
    <meta name="description" content="Sigorta · Kasko · Muayene · Bakım takibi. Araçlarının belgelerini fotoğrafla, tarihlerini otomatik oku." />
    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Garajım" />
    <meta property="og:description" content="Araçlarının sigorta, kasko, muayene ve bakım tarihlerini takip et." />
    <meta property="og:image"       content="/icons/icon-512.png" />
    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Garajım" />
    <meta name="twitter:description" content="Araçlarının sigorta, kasko, muayene ve bakım tarihlerini takip et." />
    <meta name="twitter:image"       content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
